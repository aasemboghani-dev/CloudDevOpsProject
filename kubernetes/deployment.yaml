apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-devops-app
  template:
    metadata:
      labels:
        app: cloud-devops-app
    spec:
      containers:
        - name: cloud-devops-app
          image: 090597375004.dkr.ecr.ap-south-1.amazonaws.com/cloud-devops-app:latest
          ports:
            - containerPort: 5000